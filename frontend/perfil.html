<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Perfil - Mis Tareas" />
  <title>Mi Perfil - Mis Tareas</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="perfil.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Mis Tareas</h1>
      </div>
      
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i class="fas fa-tasks"></i>
          <span>Mis Tareas</span>
        </a>
        <a href="perfil.html" class="nav-item active">
          <i class="fas fa-user"></i>
          <span>Mi Perfil</span>
        </a>
        <a href="admin.html" class="nav-item admin-item" style="display: none;">
          <i class="fas fa-users-cog"></i>
          <span>Administración</span>
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-info">
          <i class="fas fa-user-circle"></i>
          <span id="userName">Usuario</span>
        </div>
        <a href="perfil.html" class="nav-item active">
          <i class="fas fa-cog"></i>
          <span>Configuración</span>
        </a>
        <a href="#" class="nav-item" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i>
          <span>Cerrar Sesión</span>
        </a>
      </div>
    </aside>

    <!-- Overlay para móvil -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="content-container">
        <div class="content-header">
          <button class="hamburger-btn" id="hamburgerBtn">
            <i class="fas fa-bars"></i>
          </button>
          <h2>Mi Perfil</h2>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>

        <div class="perfil-content">
          <div class="perfil-section">
            <h3>Información Personal</h3>
            <form class="perfil-form" id="perfilForm">
              <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" disabled>
              </div>

              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com">
              </div>

              <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678">
              </div>

              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Actualizar Información
              </button>
            </form>
          </div>

          <div class="perfil-section">
            <h3>Cambiar Contraseña</h3>
            <form class="perfil-form" id="passwordForm">
              <div class="form-group">
                <label for="currentPassword">Contraseña Actual</label>
                <input type="password" id="currentPassword" name="currentPassword" required>
              </div>

              <div class="form-group">
                <label for="newPassword">Nueva Contraseña</label>
                <input type="password" id="newPassword" name="newPassword" required minlength="6">
              </div>

              <div class="form-group">
                <label for="confirmPassword">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
              </div>

              <button type="submit" class="btn btn-primary">
                <i class="fas fa-key"></i> Cambiar Contraseña
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="perfil.js"></script>
</body>
</html>
